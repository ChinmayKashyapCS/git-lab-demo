name: Run Python and Send Errors

on:
  push:
    branches:
      - main

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run main.py and capture error
        run: |
          python main.py || echo "ERROR_OCCURED" > error.txt

      - name: Send error to Zapier
        if: failure()
        run: |
          ERROR=$(cat error.txt)
          curl -X POST YOUR_ZAPIER_WEBHOOK_URL \
          -H "Content-Type: application/json" \
          -d "{\"error\": \"$ERROR\"}"
